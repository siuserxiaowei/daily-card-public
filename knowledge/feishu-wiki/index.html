<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书 Wiki 知识库归档</title>
  <style>
    :root{--bg:#f4f1eb;--ink:#171717;--muted:#706960;--card:#fffaf2;--line:#ded4c5;--red:#c84d3f;--teal:#0f766e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7}.hero{background:linear-gradient(135deg,#171717,#214642 62%,#8b4f22);color:white;padding:54px 22px}.inner{max-width:1040px;margin:0 auto}.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#eadfd0}.hero h1{font-size:42px;line-height:1.1;margin:10px 0}.hero p{max-width:760px;color:#eadfd0;margin:0}.wrap{max-width:1040px;margin:0 auto;padding:28px 22px 80px}.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 12px 34px rgba(68,48,28,.06);transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(68,48,28,.11)}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pill{font-size:12px;font-weight:800;color:var(--teal);background:#e8f3ef;border:1px solid #d1e5dd;border-radius:999px;padding:4px 9px}.card h2{font-size:26px;line-height:1.22;margin:0 0 8px}.card p{color:var(--muted);margin:0}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.links span{border-bottom:1px dashed var(--red);color:var(--red);font-weight:800;font-size:14px}@media(max-width:680px){.hero h1{font-size:30px}.card h2{font-size:22px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="inner">
      <div class="kicker">FEISHU WIKI ARCHIVE</div>
      <h1>飞书 Wiki 知识库归档</h1>
      <p>从飞书 Wiki 抓取到本地的可检索资料。每个归档保留原始 Markdown、manifest 和可浏览 HTML。</p>
    </div>
  </header>
  <main class="wrap">
    <a class="card" href="one-person-company-0-100w-2026/index.html">
      <div class="meta"><span class="pill">一人公司</span><span class="pill">根页面 + 29 个子文档</span><span class="pill">0 失败</span></div>

      <div class="links"><span>打开知识库归档</span><span>查看 Markdown 原文</span><span>查看 manifest</span></div>
    </a>
  </main>
</body>
</html>
